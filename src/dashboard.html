<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Super Monitor - Bandarmotologi</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--gr:#3fb950;--rd:#f85149;--yl:#d29922;--or:#db6d28;--bl:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;font-weight:600}
.stats-row{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:center}.stat .val{font-size:20px;font-weight:700}.stat .lbl{font-size:10px;color:var(--muted);text-transform:uppercase}
.ws-dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:4px}.ws-on{background:var(--gr)}.ws-off{background:var(--rd)}
.container{padding:12px;max-width:1600px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--card);font-size:12px}.tab.active{background:var(--bl);border-color:var(--bl);color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:500;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:hover{background:rgba(88,166,255,0.06)}
.pair-link{color:var(--bl);text-decoration:none;font-weight:600;cursor:pointer}
.score-bar{width:80px;height:4px;background:#21262d;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:4px}
.score-fill{height:100%;border-radius:2px}
.s-hi{background:var(--rd)}.s-md{background:var(--or)}.s-lo{background:var(--yl)}.s-no{background:var(--muted)}
.wall-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;margin:0 2px;font-weight:600}
.wall-bid{background:rgba(63,185,80,0.15);color:var(--gr)}
.wall-ask{background:rgba(248,81,73,0.15);color:var(--rd)}
.low-liq{background:rgba(210,153,34,0.15);color:var(--yl);padding:1px 4px;border-radius:3px;font-size:10px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999}
.modal.active{display:flex;justify-content:center;align-items:center}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:900px;width:95%;max-height:85vh;overflow-y:auto}
.modal-close{float:right;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.depth-grid{display:flex;gap:16px;flex-wrap:wrap}.depth-col{flex:1;min-width:220px}
.depth-bar-wrap{display:flex;align-items:center;gap:6px;font-size:11px;font-family:monospace}
.depth-bar{height:14px;border-radius:3px;background:rgba(88,166,255,0.2);transition:width .3s}
.refresh-tag{font-size:10px;color:var(--muted);font-style:italic}
.flex{display:flex;gap:8px;flex-wrap:wrap}
#alerts-box{max-height:200px;overflow-y:auto;font-size:11px;font-family:monospace}
.alert{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--border)}
@media(max-width:768px){.stats-row{gap:8px}.stat .val{font-size:16px}td,th{font-size:10px;padding:4px 4px}}
</style>
</head>
<body>

<header>
  <h1>🔍 Super Monitor Bandarmotologi</h1>
  <div class="stats-row">
    <div class="stat"><div class="val" id="pairCount">-</div><div class="lbl">Pairs</div></div>
    <div class="stat"><div class="val" id="totalWhales">-</div><div class="lbl">Whales 24h</div></div>
    <div class="stat"><div class="val" id="avgScore">-</div><div class="lbl">Avg Score</div></div>
    <div class="stat"><div class="val" id="uptime">-</div><div class="lbl">Uptime</div></div>
  </div>
  <div id="wsStatus" style="font-size:11px"></div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="all">All Pairs</div>
    <div class="tab" data-tab="whales">🟠 Whales (≥70)</div>
    <div class="tab" data-tab="extreme">🔴 Extreme (≥80)</div>
    <div class="tab" data-tab="alerts">Alerts</div>
  </div>

  <div class="flex">
    <div style="flex:1;min-width:0;overflow-x:auto" id="tableArea"></div>
    <div style="width:300px;min-width:250px">
      <div style="font-weight:600;margin-bottom:8px">🚨 Alert Feed</div>
      <div id="alertsBox"></div>
    </div>
  </div>

  <div style="margin-top:16px">
    <div style="font-weight:600;margin-bottom:8px">📊 Forward-Test Accuracy</div>
    <div id="fwdStats"></div>
  </div>
</div>

<div class="modal" id="detailModal">
  <div class="modal-box" id="detailContent"></div>
</div>

<script>
let state = { pairs: [], alerts: [] };
let currentTab = 'all';

async function load() {
  try {
    const r = await fetch('/api/state');
    if (!r.ok) return;
    state = await r.json();
    render();
  } catch(e) { console.error(e); }
}

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById('totalWhales').textContent = s.totalWhales24h || 0;
    document.getElementById('avgScore').textContent = s.avgScore24h || 0;
    document.getElementById('pairCount').textContent = s.pairCount || 0;
    const u = s.uptime || 0;
    const h = Math.floor(u/3600), m = Math.floor((u%3600)/60);
    document.getElementById('uptime').textContent = h + 'h ' + m + 'm';

    const ws = s.wsStatus || {};
    document.getElementById('wsStatus').innerHTML =
      '<span class="ws-dot ' + (ws.binance==='connected'?'ws-on':'ws-off') + '"></span>Binance ' +
      '<span class="ws-dot ' + (ws.bybit==='connected'?'ws-on':'ws-off') + '"></span>Bybit ' +
      '<span class="ws-dot ' + (ws.okx==='connected'?'ws-on':'ws-off') + '"></span>OKX';
  } catch(e) {}
}

function render() {
  let pairs = state.pairs || [];
  if (currentTab === 'whales') pairs = pairs.filter(p => p.whaleScore >= 70);
  if (currentTab === 'extreme') pairs = pairs.filter(p => p.whaleScore >= 80);

  let html = '<table><thead><tr>' +
    '<th>Pair</th><th>Price</th><th>Spread</th><th>BidVol</th><th>AskVol</th><th>Imb</th>' +
    '<th>Walls</th><th>Spoof</th><th>OFI 5m</th><th>Cross</th><th>Score</th>' +
    '</tr></thead><tbody>';

  for (const p of pairs) {
    const sc = p.whaleScore || 0;
    const sClass = sc >= 70 ? 's-hi' : sc >= 50 ? 's-md' : sc >= 30 ? 's-lo' : 's-no';
    const walls = (p.walls || []).map(w =>
      '<span class="wall-tag ' + (w.side==='bid'?'wall-bid':'wall-ask') + '">' +
      w.side.toUpperCase() + ' ' + (w.ratio||'') + 'x' +
      (w.age>0?' <small>'+w.age+'s</small>':'') + '</span>'
    ).join('');

    html += '<tr>' +
      '<td><a class="pair-link" onclick="openDetail('' + p.symbol + '')">' + p.symbol + '</a>' +
      (p.lowLiquidity ? ' <span class="low-liq">LOW</span>' : '') + '</td>' +
      '<td>' + (p.price ? '$'+p.price.toFixed(4) : '-') + '</td>' +
      '<td>' + (p.spread||0) + '%</td>' +
      '<td>' + fmtVol(p.bidVolume) + '</td>' +
      '<td>' + fmtVol(p.askVolume) + '</td>' +
      '<td style="color:' + (p.imbalance>=1.2?'var(--gr)':p.imbalance<=0.8?'var(--rd)':'') + '">' + (p.imbalance||0).toFixed(2) + 'x</td>' +
      '<td>' + walls + '</td>' +
      '<td>' + (p.spoofRecent||0) + '</td>' +
      '<td style="color:' + (p.ofi_5m>0?'var(--gr)':'var(--rd)') + '">' + (p.ofi_5m||0) + '</td>' +
      '<td>' + (p.crossExDiscrepancy||0) + '</td>' +
      '<td><div class="score-bar"><div class="score-fill ' + sClass + '" style="width:' + sc + '%"></div></div> ' + sc + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tableArea').innerHTML = html;

  // Alerts
  const alerts = state.alerts || [];
  let ahtml = '';
  for (const a of alerts.slice(0, 30)) {
    const d = new Date(a.ts);
    ahtml += '<div class="alert">' +
      '<span style="color:var(--muted)">' + d.toLocaleTimeString() + '</span>' +
      '<span>' + (a.message||'').replace(/\n/g,'<br>') + '</span></div>';
  }
  document.getElementById('alertsBox').innerHTML = ahtml || '<div style="color:var(--muted)">No alerts yet</div>';

  // Forward test
  loadFwd();
}

function fmtVol(v) { if(!v) return '-'; if(v>1e6) return (v/1e6).toFixed(1)+'M'; if(v>1e3) return (v/1e3).toFixed(1)+'K'; return v.toFixed(0); }

async function loadFwd() {
  try {
    const r = await fetch('/api/fwd');
    if (!r.ok) return;
    const f = await r.json();
    const stats = f.stats || {};
    let html = '<table><thead><tr><th>TF</th><th>Total</th><th>Avg Change</th></tr></thead><tbody>';
    for (const [tf, s] of Object.entries(stats)) {
      html += '<tr><td>' + tf + '</td><td>' + s.completed + '</td><td style="color:' + (s.avgChange>0?'var(--gr)':'var(--rd)') + '">' + (s.avgChange||0).toFixed(2) + '%</td></tr>';
    }
    html += '</tbody></table>';
    document.getElementById('fwdStats').innerHTML = html;
  } catch(e) {}
}

async function openDetail(symbol) {
  try {
    const r = await fetch('/api/pair/' + symbol + '/depth');
    if (!r.ok) return;
    const d = await r.json();

    let html = '<button class="modal-close" onclick="closeDetail()">&times;</button>';
    html += '<h2>' + symbol + ' Depth</h2>';
    html += '<div class="depth-grid">';

    // Binance
    html += '<div class="depth-col"><h3>Binance</h3>';
    html += buildDepthBars(d.binance?.bids || [], d.binance?.asks || [], d.walls || []);
    html += '</div>';

    // Bybit
    html += '<div class="depth-col"><h3>Bybit</h3>';
    html += buildDepthBars(d.bybit?.bids || [], d.bybit?.asks || [], d.walls || []);
    html += '</div>';

    // OKX
    html += '<div class="depth-col"><h3>OKX</h3>';
    html += buildDepthBars(d.okx?.bids || [], d.okx?.asks || [], d.walls || []);
    html += '</div>';

    html += '</div>';

    // Walls
    if (d.walls && d.walls.length > 0) {
      html += '<div style="margin-top:12px"><strong>Detected Walls:</strong> ';
      for (const w of d.walls) {
        html += '<span class="wall-tag ' + (w.side==='bid'?'wall-bid':'wall-ask') + '">' +
          w.side.toUpperCase() + ' @ ' + w.price + ' (' + w.qty + ') ' + w.ratio + 'x</span> ';
      }
      html += '</div>';
    }

    document.getElementById('detailContent').innerHTML = html;
    document.getElementById('detailModal').classList.add('active');
  } catch(e) {}
}

function buildDepthBars(bids, asks, walls) {
  const maxQty = Math.max(...bids.map(b => b.qty||0), ...asks.map(a => a.qty||0), 1);
  let html = '<div style="font-size:11px;font-family:monospace">';

  // Asks (sellers)
  html += '<div style="color:var(--rd);margin-bottom:4px">ASKS</div>';
  for (const a of asks.reverse().slice(0, 10)) {
    const pct = (a.qty/maxQty*100).toFixed(1);
    const isWall = walls.some(w => w.side==='ask' && Math.abs(w.price-a.price)<0.01);
    html += '<div class="depth-bar-wrap" style="justify-content:flex-end">' +
      '<span>$' + a.price.toFixed(4) + '</span>' +
      '<span>' + a.qty.toFixed(2) + '</span>' +
      '<div class="depth-bar" style="width:' + pct + '%;background:rgba(248,81,73,' + (pct/50+0.1).toFixed(2) + ')' + (isWall?'border:2px solid #f85149':'') + '"></div>' +
      '</div>';
  }
  // Price mid
  html += '<div style="text-align:center;color:var(--bl);margin:4px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:2px">--- MID ---</div>';
  // Bids (buyers)
  html += '<div style="color:var(--gr);margin-bottom:4px">BIDS</div>';
  for (const b of bids.slice(0, 10)) {
    const pct = (b.qty/maxQty*100).toFixed(1);
    const isWall = walls.some(w => w.side==='bid' && Math.abs(w.price-b.price)<0.01);
    html += '<div class="depth-bar-wrap">' +
      '<div class="depth-bar" style="width:' + pct + '%;background:rgba(63,185,80,' + (pct/50+0.1).toFixed(2) + ')' + (isWall?'border:2px solid #3fb950':'') + '"></div>' +
      '<span>' + b.qty.toFixed(2) + '</span>' +
      '<span>$' + b.price.toFixed(4) + '</span>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('active');
}

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    if (currentTab === 'alerts') {
      document.getElementById('tableArea').innerHTML = '<div style="padding:20px;color:var(--muted)">Alert feed is shown on the right panel</div>';
    }
    render();
  });
});

// Auto refresh
setInterval(load, 2000);
setInterval(loadStats, 10000);
load();
loadStats();

// Close modal on Escape
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });
document.getElementById('detailModal').addEventListener('click', function(e) {
  if(e.target===this) closeDetail();
});
</script>
</body>
</html>
